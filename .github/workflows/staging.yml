name: Staging

# Crawls every spider on the `staging` branch and writes the feed to the staging
# Azure container (AZURE_STAGING_CONTAINER), which the staging Documenters site
# imports from. It never touches the production container used by `cron.yml`.
#
# Deliberately no `schedule:` trigger and no `workflow-keepalive` job. Every
# scheduled workflow in this org that carries `liskin/gh-workflow-keepalive`
# (this repo's cron.yml and archive.yml, and city-scrapers-colgo's staging.yml)
# had its schedule trigger orphaned onto a phantom workflow object on
# 2026-07-08/09 and has fired `startup_failure` twice daily since; the two
# scheduled workflows without it have run every day. Adding a nightly staging
# refresh is a follow-up, and must not reintroduce the keepalive job.
on:
  push:
    branches:
      - staging
    # A full crawl takes ~20-30 minutes, so don't spend one on a docs or
    # skills-only commit.
    paths-ignore:
      - "**.md"
      - ".claude/**"
      - "LICENSE"
  workflow_dispatch:

env:
  CI: true
  PYTHON_VERSION: 3.11
  PIPENV_VENV_IN_PROJECT: true
  CITY_SCRAPERS_ENV: staging
  SCRAPY_SETTINGS_MODULE: city_scrapers.settings.staging
  AUTOTHROTTLE_MAX_DELAY: 30.0
  AUTOTHROTTLE_START_DELAY: 1.5
  AUTOTHROTTLE_TARGET_CONCURRENCY: 3.0
  AZURE_ACCOUNT_KEY: ${{ secrets.AZURE_ACCOUNT_KEY }}
  AZURE_ACCOUNT_NAME: ${{ secrets.AZURE_ACCOUNT_NAME }}
  AZURE_STAGING_CONTAINER: ${{ secrets.AZURE_STAGING_CONTAINER }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ env.PYTHON_VERSION }}-${{ hashFiles('**/Pipfile.lock') }}
          restore-keys: |
            ${{ env.PYTHON_VERSION }}-
            pip-

      - name: Check and conditionally remove invalid virtual environment
        run: |
          if [ -d ".venv" ] && [ ! -f ".venv/bin/python" ]; then
            echo "Virtual environment exists but Python executable is missing. Rebuilding."
            rm -rf .venv
          elif [ ! -d ".venv" ]; then
            echo "No virtual environment found. Will build new one."
          elif ! .venv/bin/python --version 2>&1 | grep -q "Python ${{ env.PYTHON_VERSION }}"; then
            echo "Virtual environment Python version mismatch. Rebuilding."
            rm -rf .venv
          else
            echo "Virtual environment appears valid. Reusing."
          fi

      - name: Install dependencies
        run: pipenv sync
        env:
          PIPENV_DEFAULT_PYTHON_VERSION: ${{ env.PYTHON_VERSION }}

      - name: Verify staging container is configured
        run: |
          if [ -z "$AZURE_STAGING_CONTAINER" ]; then
            echo "AZURE_STAGING_CONTAINER is not set. Refusing to crawl:"
            echo "an empty container would make the feed URI ambiguous."
            exit 1
          fi
          echo "Writing feed to container: $AZURE_STAGING_CONTAINER"

      - name: Run scrapers
        run: |
          export PYTHONPATH=$(pwd):$PYTHONPATH
          ./.deploy.sh

      - name: Combine output feeds
        run: |
          export PYTHONPATH=$(pwd):$PYTHONPATH
          pipenv run scrapy combinefeeds -s LOG_ENABLED=False
